# .github/workflows/docs.yml
# Builds the mdbook documentation (dev/docs) and publishes it to GitHub Pages.
# Requires: repo Settings → Pages → Source = "GitHub Actions" (one-time, manual).
name: Deploy Docs

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "dev/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      # The engine reference docs (REFERENCE/CONFIGURATION/ARCHITECTURE) are vendored
      # from the sibling engine repo by dev/docs/sync-engine-docs.sh.
      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: marcomq/mq-bridge
          path: _engine

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Vendor engine docs
        env:
          ENGINE_REPO: ${{ github.workspace }}/_engine
        run: bash dev/docs/sync-engine-docs.sh

      - name: Build book
        run: mdbook build dev/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dev/docs/book

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
