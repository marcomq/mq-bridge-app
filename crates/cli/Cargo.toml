[package]
name = "mq-bridge-app"
version.workspace = true
edition.workspace = true
build = "build.rs"
authors = ["Marco Mengelkochs"]
repository = "https://github.com/marcomq/mq-bridge-app"
license = "MIT"
description = "A message queue bridge application written in Rust, designed to connect different messaging systems like RabbitMQ, Kafka, and NATS."
readme = "../../README.md"
keywords = ["messaging", "kafka", "nats", "amqp", "cqrs"]
categories = ["asynchronous", "network-programming"]

[[bin]]
name = "mq-bridge-app"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/mq-bridge-cli-{ target }{ archive-suffix }"
bin-dir = "mq-bridge-cli{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
mq_bridge_app = { workspace = true }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
metrics = { version = "0.24.6" }
metrics-exporter-prometheus = "0.18.1"
rustls = "0.23.40"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "tracing", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.7"

# MCP server mode (`mq-bridge-app mcp`). Streamable-HTTP is served over hyper (no axum).
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }

[features]
default = ["full"]
integration-test = ["mq_bridge_app/integration-test"]
# Lean feature set for the ETL/CDC benchmarks (benches/etl): see the core crate.
bench = ["mq_bridge_app/bench"]
ibm-mq = ["mq_bridge_app/ibm-mq"]
arm64-cross-compile = ["mq_bridge_app/arm64-cross-compile"]
full = ["mq_bridge_app/full"]
middleware = ["mq_bridge_app/middleware"]
mongodb = ["mq_bridge_app/mongodb"]
http = ["mq_bridge_app/http"]
kafka = ["mq_bridge_app/kafka"]
aws = ["mq_bridge_app/aws"]
nats = ["mq_bridge_app/nats"]
mqtt = ["mq_bridge_app/mqtt"]
zeromq = ["mq_bridge_app/zeromq"]
sled = ["mq_bridge_app/sled"]
grpc = ["mq_bridge_app/grpc"]
amqp = ["mq_bridge_app/amqp"]
redis-streams = ["mq_bridge_app/redis-streams"]

[dev-dependencies]
metrics = { version = "0.24.6" }
metrics-exporter-prometheus = "0.18.3"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["io-util", "net", "rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.23", features = ["v4"] }
