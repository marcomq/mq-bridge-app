[package]
name = "mq-bridge-app-core"
version.workspace = true
edition.workspace = true
authors = ["Marco Mengelkochs"]
repository = "https://github.com/marcomq/mq-bridge-app"
license = "MIT"
description = "Shared core library for mq-bridge-app."
readme = "../../README.md"
keywords = ["messaging", "kafka", "nats", "amqp", "cqrs"]
categories = ["asynchronous", "network-programming"]
build = "build.rs"

[lib]
name = "mq_bridge_app"
path = "src/lib.rs"

[dependencies]
# NOTE: this is a local path dep on the sibling ../mq-bridge checkout, so the
# build only works with that checkout present. Switch to the crates.io line
# below (or use `cargo --config patch`) before publishing.
mq-bridge = { version = "0.3.6", features = ["schema"] }
# mq-bridge = { path = "../../../mq-bridge", version = "0.3.6", features = ["schema"] } # keep for debugging / dev

config = { version = "0.15.22", features = ["yaml"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
shellexpand = "3.1.2"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.51.0", features = ["rt-multi-thread", "macros", "signal", "tracing", "sync"] }
anyhow = "1.0.103"
tracing = "0.1.44"
rdkafka = { version = "0.38.0", features = ["tokio"], optional = true }
metrics = { version = "0.24.6" }
metrics-exporter-prometheus = "0.18.1"
schemars = "1.2.1"
serde_json = "1.0.149"
base64 = "0.22.1"
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
zeroize = "1.8"
hex = "0.4"
sha2 = "0.10"
futures = "0.3.32"
uuid = { version = "1.23", features = ["v4", "v7"] }
rustls = "0.23.38"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
url = "2.5.7"
fast-uuid-v7 = "0.1.3"
# Embeds the web UI (crates/core/static) into the binary so the UI is served
# from a single `cargo install`ed executable. In debug builds it reads the
# files from disk for live editing; in release builds it embeds them.
rust-embed = "8.7"

[features]
default = ["full"]
integration-test = []
ibm-mq = ["mq-bridge/ibm-mq"]
arm64-cross-compile = ["rdkafka", "rdkafka/cmake-build"]
full = ["mq-bridge/full"]
# Lean feature set for the ETL/CDC benchmarks (benches/etl): Postgres bulk-insert
# (sqlx) + logical-replication CDC + per-route metrics, with a TLS provider so the
# binary links. Avoids the heavy `full` deps (rdkafka/librdkafka, grpc/protoc,
# ibm-mq) that aren't needed to move Postgres data.
#
# NOTE: `bench` intentionally does NOT include any message-broker transport. A
# broker-throughput benchmark layers its transport on top, e.g. the NATS bench
# (benches/etl/run_nats_throughput.sh) builds with `--features bench,nats`.
bench = [
    "mq-bridge/sqlx",
    "mq-bridge/postgres-cdc",
    "mq-bridge/middleware",
    "mq-bridge/rustls-aws-lc",
]
middleware = ["mq-bridge/middleware"]
compression = ["mq-bridge/compression"]
encryption = ["mq-bridge/encryption"]
sqlx = ["mq-bridge/sqlx"]
postgres-cdc = ["mq-bridge/postgres-cdc"]
rustls-aws-lc = ["mq-bridge/rustls-aws-lc"]
mongodb = ["mq-bridge/mongodb"]
http = ["mq-bridge/http"]
kafka = ["mq-bridge/kafka"]
aws = ["mq-bridge/aws"]
nats = ["mq-bridge/nats"]
mqtt = ["mq-bridge/mqtt"]
zeromq = ["mq-bridge/zeromq"]
sled = ["mq-bridge/sled"]
grpc = ["mq-bridge/grpc"]
amqp = ["mq-bridge/amqp"]
redis-streams = ["mq-bridge/redis-streams"]
object-store = ["mq-bridge/object-store"]
