[env]
CMAKE_ARGS = "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

[build]
rustflags = ["--cfg", "tokio_unstable"]

# target.<triple>.rustflags REPLACES build.rustflags, so repeat --cfg tokio_unstable here.
[target.aarch64-apple-darwin]
rustflags = ["--cfg", "tokio_unstable", "-C", "link-arg=-Wl,-no_compact_unwind"]

[target.x86_64-apple-darwin]
rustflags = ["--cfg", "tokio_unstable", "-C", "link-arg=-Wl,-no_compact_unwind"]

